name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Repository checks
        run: npm run check
      - name: Test suites (host e2e + regression + client smoke)
        run: npm test
